<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Rent Management{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">🏠 Rent Manager</div>
    <div class="nav-links">
        {% if session.get('role') == 'owner' %}
            <a href="{{ url_for('owner.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('owner.manage_renters_page') }}">Renters</a>
        {% endif %}
        {% if session.get('token') %}
            <span class="nav-user">👤 {{ session.get('username') }}</span>
            <a href="{{ url_for('auth.logout') }}" class="btn-logout">Logout</a>
        {% endif %}
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
