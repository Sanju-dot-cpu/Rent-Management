<div class="tab-header">
    <h2>Electricity Bill</h2>
    <div class="tab-actions">
        <button class="btn-secondary" onclick="downloadBillPdf()">⬇ PDF</button>
        <button class="btn-primary" onclick="openAddBillModal()">+ Add Bill Entry</button>
    </div>
</div>

<div class="table-wrap">
<table class="data-table" id="billTable">
    <thead>
        <tr>
            <th>Month</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Units</th>
            <th>Amount</th>
            <th>Paid Date</th>
            <th>Balance Amount</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="billBody">
        <tr><td colspan="9" class="loading">Loading...</td></tr>
    </tbody>
</table>
</div>

<div id="billModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeBillModal()">&times;</span>
        <h2 id="billModalTitle">Add Bill Entry</h2>
        <div id="billError" class="error-msg" style="display:none;"></div>

        <form id="billForm">
            <input type="hidden" id="bill_id">
            <div class="form-group">
                <label>Month</label>
                <input type="text" id="bill_month" placeholder="e.g. Jan" required>
            </div>
            <div class="form-group">
                <label>Start Date</label>
                <input type="date" id="bill_start_date" required>
            </div>
            <div class="form-group">
                <label>Units</label>
                <input type="number" id="bill_units" required>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" step="0.01" id="bill_amount" required>
            </div>
            <div class="form-group">
                <label>Paid Date</label>
                <input type="date" id="bill_paid_date">
            </div>
            <div class="form-group">
                <label>Balance Amount</label>
                <input type="number" step="0.01" id="bill_balance_amount" value="0">
            </div>
            <div class="form-group">
                <label>Paid / Pending</label>
                <select id="bill_status" required>
                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">Save</button>
        </form>
    </div>
</div>
